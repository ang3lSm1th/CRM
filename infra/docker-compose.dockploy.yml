services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-services:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ../.env.dockploy
    environment:
      USE_CELERY: "1"
      WORKFLOW_DISTRIBUTED: "1"
      REDIS_URL: redis://redis:6379/0
      AGENT_SERVICE_URL: http://agent-services:8001
      WEB_SERVICE_URL: http://app:8000
    volumes:
      - ../backups:/app/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  workflow-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A core.celery_app.celery worker --loglevel=info -Q workflow
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-services:
        condition: service_healthy
    env_file:
      - ../.env.dockploy
    environment:
      USE_CELERY: "1"
      WORKFLOW_DISTRIBUTED: "1"
      REDIS_URL: redis://redis:6379/0
      AGENT_SERVICE_URL: http://agent-services:8001

  agent-services:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python -m gunicorn -b 0.0.0.0:8001 --workers 1 --timeout 120 entrypoints.agent_service:app
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ../.env.dockploy
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    env_file:
      - ../.env.dockploy
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../db/schemas/Database.sql:/docker-entrypoint-initdb.d/01-main.sql:ro
      - ../db/schemas/bd_tracores.sql:/docker-entrypoint-initdb.d/02-tractor.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  mysql_data:
